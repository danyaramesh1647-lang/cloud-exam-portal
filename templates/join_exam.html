{% extends "base.html" %}

{% block title %}Join Exam | Cloud Exam Portal{% endblock %}

{% block content %}

<div class="d-flex justify-content-center">
    <div class="card auth-card p-4">

        <div class="text-center mb-3">
            <i class="bi bi-key-fill auth-logo"></i>
            <h2>Join an Exam</h2>
            <p class="text-muted">Enter the code your teacher shared with you.</p>
        </div>

        <form method="POST">
            <label>Access Code</label>
            <input type="text" name="access_code" class="form-control text-center"
                style="letter-spacing:4px; font-size:22px; text-transform:uppercase;"
                maxlength="6" placeholder="X7K2P9" required autofocus>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg">Join Exam</button>
            </div>
        </form>

        <p class="text-center mt-3 mb-0">
            <a href="{{ url_for('dashboard') }}">&larr; Back to Dashboard</a>
        </p>

    </div>
</div>
{% endblock %}
