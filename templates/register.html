{% extends "base.html" %}

{% block title %}Register | Cloud Exam Portal{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card auth-card p-4">

        <div class="text-center mb-3">
            <i class="bi bi-cloud-fill auth-logo"></i>
            <h2>Create your account</h2>
            <p class="text-muted">Register as an admin or student to get started.</p>
        </div>

        <form method="POST">

            <label>Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Your full name" required>

            <label>Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>

            <label>Password</label>
            <input type="password" name="password" class="form-control" placeholder="Choose a password" required>

            <label>Role</label>
            <select name="role" class="form-select">
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-success btn-lg">Register</button>
            </div>

        </form>

        <hr>

        <p class="text-center mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>
</div>
{% endblock %}
